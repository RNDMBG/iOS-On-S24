name: xnu-e1s

on:
  workflow_dispatch:
  push:
    branches: [main, experimental/xnu-e1s]
    paths:
      - "xnu/hackios/**"
      - "xnu/e1s/**"
      - "tools/e1s/**"
      - ".github/workflows/xnu.yml"
  pull_request:
    paths:
      - "xnu/hackios/**"
      - "xnu/e1s/**"
      - "tools/e1s/**"

concurrency:
  group: xnu-e1s-${{ github.ref }}
  cancel-in-progress: true

jobs:
  series:
    # The full kernel build needs clang, Theos cctools and the iPhoneOS16.5
    # SDK (see xnu/e1s/README.md).  This job verifies the thing that
    # breaks most often: that the pinned HackiOS base and every e1s patch still
    # apply to xnu-8796.121.2, plus the host-side ADT/touch/PMIC/battery
    # checks.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Host checks
        run: |
          python3 tools/e1s/test_e1s_adt.py
          python3 tools/e1s/test_e1s_fdt.py
          python3 tools/e1s/test_e1s_touch.py
          python3 tools/e1s/test_e1s_keys.py
          python3 tools/e1s/test_e1s_ufs.py
          python3 tools/e1s/test_e1s_camera.py
          python3 tools/e1s/test_e1s_pmic.py
          python3 tools/e1s/test_e1s_battery.py

      - name: Apply the HackiOS base and the e1s series
        run: |
          bash xnu/e1s/apply.sh "$RUNNER_TEMP/xnu-src"
          test -f "$RUNNER_TEMP/xnu-src/config/MASTER.arm64.e1s"
          test -f "$RUNNER_TEMP/xnu-src/pexpert/pexpert/arm64/E1S.h"
          test -f "$RUNNER_TEMP/xnu-src/bsd/dev/e1s_touch.c"
          test -f "$RUNNER_TEMP/xnu-src/bsd/dev/e1s_input.c"
          test -f "$RUNNER_TEMP/xnu-src/bsd/dev/e1s_ufs.c"
          test -f "$RUNNER_TEMP/xnu-src/bsd/dev/e1s_camera.c"
          test -f "$RUNNER_TEMP/xnu-src/bsd/dev/e1s_acpm.c"
          test -f "$RUNNER_TEMP/xnu-src/bsd/dev/e1s_pmic.c"
          test -f "$RUNNER_TEMP/xnu-src/bsd/dev/e1s_battery.c"
          git -C "$RUNNER_TEMP/xnu-src" diff --stat

      - name: Summary
        run: |
          echo "base + patches applied; MACHINE_CONFIG=E1S" >> "$GITHUB_STEP_SUMMARY"
          echo "No kernel was built in CI; see xnu/e1s/README.md." >> "$GITHUB_STEP_SUMMARY"
